name: Build eslint-config-scratch

on:
  push:
  pull_request: # for PRs from forks; branches in this repo are already built on push
permissions:
  contents: read # checkout
jobs:
  build-eslint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: write # publish a GitHub release
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'
      - name: Info
        env:
          PR_HEAD_LABEL: ${{ github.event.pull_request.head.label }}
          HEAD_REF: ${{ github.head_ref }}
          REF: ${{ github.ref }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          cat <<EOF
          Node version: $(node --version)
          NPM version: $(npm --version)
          github.event.pull_request.head.label: ${PR_HEAD_LABEL}
          github.head_ref: ${HEAD_REF}
          github.ref: ${REF}
          github.workflow: ${WORKFLOW}
          EOF
      - run: npm ci
      - run: npm test
      - name: Check a fresh install of the package
        run: scripts/check-fresh-install.sh
      - name: Semantic Release
        if: github.event_name == 'push'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no -- semantic-release
